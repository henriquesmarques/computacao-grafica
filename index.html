<!DOCTYPE html>
<html>
<head>
    <title>Sistema de Combate Aereo</title>

    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="html/resources/default.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="html/resources/default.css">
    <link rel="stylesheet" href="T3/estiloJogo.css">
</head>

<body>
<script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
<script type="importmap">
    {"imports": {"three": "/computacao-grafica/build/three.module.js"}}
</script>

<div id="webgl-output">
    <script type="module" src="T3/main.js"></script>
</div>
<div id="container-vida">
    <span id="icone-coracao">❤️</span>
    <div id="barra-fundo">
        <div id="barra-preenchimento"></div>
    </div>
</div>

<div id="texto-invencivel" style="display: none;">MODO INVENCIBILIDADE</div>

<div id="tela-game-over">
    <div class="modal-conteudo">
        <h1 class="titulo-game-over">GAME OVER</h1>
        <p class="subtitulo-game-over">AVIÃO ABATIDO</p>
        <div class="stats-gameover">
            <div class="linha-stat">
                <span>TIROS SOFRIDOS</span>
                <span id="hud-valor-tiros">20</span>
            </div>
            <div class="linha-stat">
                <span>TEMPO DE VOO</span>
                <span id="hud-valor-tempo">00:00:32</span>
            </div>
        </div>
        <button id="btn-reiniciar">REINICIAR MISSÃO</button>

    </div>
</div>

<div id="tela-carregamento">
    <div class="modal-conteudo loading-hud">
        <div class="hud-topo">
        </div>

        <h1 class="subtitulo-carregando">CARREGANDO...</h1>
        <p class="titulo-inicial">SISTEMA DE COMBATE AEREO</p>

        <div class="barra-fundo-loading">
            <div id="barra-progresso-loading"></div>
        </div>
        <button id="btn-start" disabled>INICIAR MISSÃO</button>
    </div>
</div>
<div id="controles-mobile-topo">
    <button id="btn-fullscreen" class="btn-ctrl-mobl">📺 FULLSCREEN</button>
    <button id="btn-musica" class="btn-ctrl-mobl">🎵 MÚSICA: ON</button>
</div>

<div id="joystick-zone"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</body>
</html>
